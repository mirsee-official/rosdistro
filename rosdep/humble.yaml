alloy:
  ubuntu: [alloy]
grafana:
  ubuntu: [grafana]
# Repackaged NVIDIA cuMotion, built and published by mirsee_rebundle.
# libcumotion-dev for <build_depend>/<depend>; libcumotion1 for <exec_depend>.
libcumotion-dev:
  ubuntu:
    jammy: [libcumotion-dev]
libcumotion1:
  ubuntu:
    jammy: [libcumotion1]
loki:
  ubuntu: [loki]
# IgH EtherCAT master, built from Mirsee's ethercat fork (debian/) and published
# to the internal jammy apt repo. mirsee-ethercat-dev (libethercat, ecrt.h,
# pkg-config) for <build_depend>/<depend>; mirsee-ethercat (tool, library,
# ethercat.service; pulls in mirsee-ethercat-dkms) for <exec_depend>.
mirsee-ethercat:
  ubuntu:
    jammy: [mirsee-ethercat]
mirsee-ethercat-dev:
  ubuntu:
    jammy: [mirsee-ethercat-dev]
mirsee-ethercat-dkms:
  ubuntu:
    jammy: [mirsee-ethercat-dkms]
prometheus:
  ubuntu: [prometheus]
prometheus-node-exporter:
  ubuntu: [prometheus-node-exporter]
stereolabs-zedlink-duo:
  ubuntu:
    jammy: [stereolabs-zedlink-duo]
# Every package the ZED SDK installer (5.1.2, L4T 36.4) checks for when run as
# root with `-- silent skip_python`, so it never calls apt itself. Keep in step
# with DEPENDENCIES in mh3_perception/system/scripts/zed-sdk.
zed-sdk-dependencies:
  ubuntu:
    jammy: [libjpeg-turbo8, libturbojpeg, libusb-1.0-0, libusb-1.0-0-dev, libopenblas-dev, libarchive-dev, libv4l-0, curl, unzip, zlib1g, mesa-utils, libpng-dev, libglew-dev, freeglut3-dev, qtbase5-dev, qtchooser, qt5-qmake, qtbase5-dev-tools, libqt5opengl5, libqt5svg5, lsb-release, wget, less, udev, sudo, apt-transport-https, file, zstd]
